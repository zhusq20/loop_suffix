[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "loop-suffix"
version = "0.1.0"
description = "LoopFill: suffix-tree drafts plus early-loop readouts for speculative decoding of looped LMs"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<3"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.6,<1"]
models = ["torch>=2.5,<3", "transformers"]
analysis = ["matplotlib>=3.9,<4"]
tracking = ["wandb==0.30.0"]
baselines = ["torch>=2.6,<3", "transformers==4.57.1", "safetensors>=0.5,<1", "accelerate>=1.6,<2"]

[project.scripts]
loop-baseline = "baselines.__main__:main"

[tool.setuptools.package-data]
"baselines" = ["configs/*.json", "vendor/LICENSE.*", "vendor/ORIGINS.json"]

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["llm_memory_editability*", "baselines*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py310"
line-length = 100
