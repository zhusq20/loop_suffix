[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "loop-suffix"
version = "0.1.0"
description = "LoopFill: suffix-tree drafts plus early-loop readouts for speculative decoding of looped LMs"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<3"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.6,<1"]
models = ["torch>=2.5,<3", "transformers"]
analysis = ["matplotlib>=3.9,<4"]
tracking = ["wandb==0.30.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py310"
line-length = 100
